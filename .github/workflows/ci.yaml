name: CI

on:
  workflow_call: {}

  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHART_PATH: application
  RELEASE_NAME: application
  TEST_NAMESPACE: application-test

jobs:
  lint:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Helm lint
        run: helm lint "$CHART_PATH"

  unittest:
    name: Helm unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Install helm-unittest
        env:
          # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
          HELM_UNITTEST_VERSION: v1.1.2
        # TODO: Remove --verify=false once helm-unittest publishes signed releases
        # Tracking: https://github.com/helm-unittest/helm-unittest/issues/362
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest.git --version "$HELM_UNITTEST_VERSION"

      - name: Run helm-unittest
        run: helm unittest "$CHART_PATH"

  render:
    name: Helm render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults
            values: ""
            api-versions: ""
          - name: base
            values: ci/values.yaml
            api-versions: >-
              batch/v1
              batch/v1/CronJob
              policy/v1
              policy/v1/PodDisruptionBudget
              autoscaling/v2
              autoscaling/v2/HorizontalPodAutoscaler
          - name: crds
            values: ci/values.yaml ci/values-crds.yaml
            api-versions: >-
              batch/v1
              batch/v1/CronJob
              policy/v1
              policy/v1/PodDisruptionBudget
              autoscaling/v2
              autoscaling/v2/HorizontalPodAutoscaler
              autoscaling.k8s.io/v1
              autoscaling.k8s.io/v1/VerticalPodAutoscaler
              bitnami.com/v1alpha1
              bitnami.com/v1alpha1/SealedSecret
              cert-manager.io/v1
              cert-manager.io/v1/Certificate
              endpointmonitor.stakater.com/v1alpha1
              endpointmonitor.stakater.com/v1alpha1/EndpointMonitor
              external-secrets.io/v1
              external-secrets.io/v1/ExternalSecret
              forecastle.stakater.com/v1alpha1
              forecastle.stakater.com/v1alpha1/ForecastleApp
              grafana.integreatly.org/v1beta1
              grafana.integreatly.org/v1beta1/GrafanaDashboard
              monitoring.coreos.com/v1
              monitoring.coreos.com/v1/ServiceMonitor
              monitoring.coreos.com/v1/PrometheusRule
              monitoring.coreos.com/v1alpha1
              monitoring.coreos.com/v1alpha1/AlertmanagerConfig
              route.openshift.io/v1
              route.openshift.io/v1/Route
              secrets-store.csi.x-k8s.io/v1alpha1
              secrets-store.csi.x-k8s.io/v1alpha1/SecretProviderClass
              velero.io/v1
              velero.io/v1/Backup
              gateway.networking.k8s.io/v1
              gateway.networking.k8s.io/v1/HTTPRoute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Render chart
        shell: bash
        env:
          VALUES: ${{ matrix.values }}
          API_VERSIONS: ${{ matrix.api-versions }}
        run: |
          set -euo pipefail

          args=()
          if [ -z "$VALUES" ]; then
            args+=(
              "--set" "deployment.image.repository=example-registry/example-image"
              "--set" "deployment.image.tag=example-tag"
            )
          else
            for f in $VALUES; do
              args+=("-f" "$CHART_PATH/$f")
            done
          fi

          for v in $API_VERSIONS; do
            args+=("--api-versions" "$v")
          done

          set -x
          helm template "$RELEASE_NAME" "$CHART_PATH" \
            "${args[@]}" \
            --namespace "$TEST_NAMESPACE" \
            --debug > rendered.yaml
          set +x

          test -s rendered.yaml
          cat rendered.yaml

      - name: Validate YAML syntax
        uses: frenck/action-yamllint@34b4bbcaeabedcfefad6adea8c5bbc42af0e2d47 # v1.5.0
        with:
          path: rendered.yaml
          strict: true
          warnings: false

  checkov:
    name: Checkov security scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12.3125.0
        with:
          quiet: true
          soft_fail: false
          file: ${{ env.CHART_PATH }}/Chart.yaml
          var_file: ${{ env.CHART_PATH }}/ci/values.yaml
          config_file: ${{ env.CHART_PATH }}/ci/.checkov.yaml

  helm-docs:
    name: Helm docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2
        with:
          output-file: ./../README.md
          template-files: ./README.md.gotmpl
          sort-values-order: file

      - name: Check diff
        run: |
          git diff --exit-code README.md || { echo; echo "error: README.md is out of date. Please run 'mise run gen-docs' and commit the resulting file."; exit 1; }

  helm-schema:
    name: Helm schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
          cache: true

      - name: Run helm-schema
        run: mise run gen-schema

      - name: Check diff
        run: |
          git diff --exit-code ${{ env.CHART_PATH }}/values.schema.json || { echo; echo "error: values.schema.json is out of date. Please run 'mise run gen-schema' and commit the resulting file."; exit 1; }

  kind-api-validation:
    name: Kind API validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kubernetes:
          - v1.31.14
          - v1.33.7
          - v1.35.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          node_image: kindest/node:${{ matrix.kubernetes }}

      - name: Render base profile
        run: .github/scripts/helm-template-cluster.sh rendered-base.yaml ci/values.yaml

      - name: Validate base profile
        run: |
          kubectl create namespace "$TEST_NAMESPACE"
          kubectl apply \
            --namespace "$TEST_NAMESPACE" \
            --dry-run=server \
            -f rendered-base.yaml

      # Only the CRDs are installed, never the controllers, so the CRD profile
      # gets schema validation from the API server without any operator running.
      # Keep this list in sync with the crds matrix entry of the render job.
      - name: Install CRDs
        env:
          # renovate: datasource=github-tags depName=kubernetes/autoscaler extractVersion=^vertical-pod-autoscaler-(?<version>\d+\.\d+\.\d+)$
          VPA_VERSION: 1.8.0
          # renovate: datasource=github-releases depName=bitnami-labs/sealed-secrets
          SEALED_SECRETS_VERSION: v0.40.0
          # renovate: datasource=github-releases depName=cert-manager/cert-manager
          CERT_MANAGER_VERSION: v1.21.2
          # renovate: datasource=github-releases depName=stakater/IngressMonitorController
          INGRESS_MONITOR_CONTROLLER_VERSION: v2.2.13
          # renovate: datasource=github-releases depName=external-secrets/external-secrets
          EXTERNAL_SECRETS_VERSION: v2.11.0
          # renovate: datasource=github-releases depName=stakater/Forecastle
          FORECASTLE_VERSION: v2.0.2
          # v5.25.0 adds a CEL rule using the `format` library, which Kubernetes 1.31 rejects.
          # renovate: datasource=github-releases depName=grafana/grafana-operator
          GRAFANA_OPERATOR_VERSION: v5.24.0
          # renovate: datasource=github-releases depName=prometheus-operator/prometheus-operator
          PROMETHEUS_OPERATOR_VERSION: v0.94.1
          # openshift/api publishes no releases; pinned to a commit on master.
          OPENSHIFT_API_REF: 03ac57f9648604bea9665391d6f4de5d8545db38
          # renovate: datasource=github-releases depName=kubernetes-sigs/secrets-store-csi-driver
          SECRETS_STORE_CSI_VERSION: v1.6.1
          # renovate: datasource=github-releases depName=vmware-tanzu/velero
          VELERO_VERSION: v1.18.3
          # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
          GATEWAY_API_VERSION: v1.6.2
        run: |
          set -euo pipefail

          crds=(
            "https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-${VPA_VERSION}/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml"
            "https://raw.githubusercontent.com/bitnami-labs/sealed-secrets/${SEALED_SECRETS_VERSION}/helm/sealed-secrets/crds/bitnami.com_sealedsecrets.yaml"
            "https://github.com/cert-manager/cert-manager/releases/download/${CERT_MANAGER_VERSION}/cert-manager.crds.yaml"
            "https://raw.githubusercontent.com/stakater/IngressMonitorController/${INGRESS_MONITOR_CONTROLLER_VERSION}/config/crd/bases/endpointmonitor.stakater.com_endpointmonitors.yaml"
            "https://raw.githubusercontent.com/external-secrets/external-secrets/${EXTERNAL_SECRETS_VERSION}/deploy/crds/bundle.yaml"
            "https://raw.githubusercontent.com/stakater/Forecastle/${FORECASTLE_VERSION}/deployments/kubernetes/chart/forecastle/crds/forecastleApp.yaml"
            "https://github.com/grafana/grafana-operator/releases/download/${GRAFANA_OPERATOR_VERSION}/crds.yaml"
            "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/${PROMETHEUS_OPERATOR_VERSION}/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml"
            "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/${PROMETHEUS_OPERATOR_VERSION}/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml"
            "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/${PROMETHEUS_OPERATOR_VERSION}/example/prometheus-operator-crd/monitoring.coreos.com_alertmanagerconfigs.yaml"
            "https://raw.githubusercontent.com/openshift/api/${OPENSHIFT_API_REF}/route/v1/zz_generated.crd-manifests/routes.crd.yaml"
            "https://raw.githubusercontent.com/kubernetes-sigs/secrets-store-csi-driver/${SECRETS_STORE_CSI_VERSION}/deploy/secrets-store.csi.x-k8s.io_secretproviderclasses.yaml"
            "https://raw.githubusercontent.com/vmware-tanzu/velero/${VELERO_VERSION}/config/crd/v1/bases/velero.io_backups.yaml"
            "https://github.com/kubernetes-sigs/gateway-api/releases/download/${GATEWAY_API_VERSION}/standard-install.yaml"
          )

          # Server-side apply: some CRDs exceed the last-applied annotation size limit.
          for url in "${crds[@]}"; do
            echo "::group::$url"
            kubectl apply --server-side -f "$url"
            echo "::endgroup::"
          done

          kubectl wait --for=condition=Established --all crd --timeout=120s

      - name: Render CRD profile
        run: .github/scripts/helm-template-cluster.sh rendered-crds.yaml ci/values.yaml ci/values-crds.yaml

      - name: Validate CRD profile
        run: |
          # Some resources declare their own namespace (Velero backups live in
          # the Velero namespace). Create every namespace the render mentions
          # so the server-side dry run can resolve them, and rely on the
          # context namespace for the rest instead of --namespace, which
          # rejects objects whose namespace differs.
          grep -E '^\s+namespace: ' rendered-crds.yaml \
            | awk '{ print $2 }' | tr -d '"' | sort -u \
            | while read -r ns; do
                kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
              done
          kubectl config set-context --current --namespace "$TEST_NAMESPACE"
          kubectl apply \
            --dry-run=server \
            -f rendered-crds.yaml
