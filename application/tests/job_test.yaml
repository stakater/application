suite: Job

templates:
  - job.yaml

tests:
  - it: does not fail rendering when job image tag and digest are absent
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: ""
              digest: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example-registry/example-image

  - it: fails rendering when job image repository is not given
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: ""
              tag: doesnt
              digest: matter
    asserts:
      - failedTemplate:
          errorMessage: "Undefined image repo for container 'example'"

  - it: uses tag when defined
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
              digest: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example-registry/example-image:example-tag

  - it: uses digest when defined
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: ""
              digest: sha256:example-digest
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example-registry/example-image@sha256:example-digest

  - it: uses both tag and digest when given both
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
              digest: sha256:example-digest
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example-registry/example-image:example-tag@sha256:example-digest

  - it: applies the annotations correctly on the job
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
              digest: sha256:example-digest
            annotations:
              foo: "bar"
              bar: "baz"
    asserts:
      - equal:
          path: metadata.annotations
          value:
            foo: "bar"
            bar: "baz"

  - it: applies the additionalPodAnnotations correctly on the pods
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
              digest: sha256:example-digest
            additionalPodAnnotations:
              helm.sh/hook: "pre-install,pre-upgrade"
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value:
            helm.sh/hook: "pre-install,pre-upgrade"

  - it: includes activeDeadlineSeconds when set to 0
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
            activeDeadlineSeconds: 0
    asserts:
      - isNotNull:
          path: spec.activeDeadlineSeconds
      - equal:
          path: spec.activeDeadlineSeconds
          value: 0

  - it: includes startingDeadlineSeconds when set to 0
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
            startingDeadlineSeconds: 0
    asserts:
      - isNotNull:
          path: spec.startingDeadlineSeconds
      - equal:
          path: spec.startingDeadlineSeconds
          value: 0

  - it: includes both activeDeadlineSeconds and startingDeadlineSeconds when set to 0
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
            activeDeadlineSeconds: 0
            startingDeadlineSeconds: 0
    asserts:
      - isNotNull:
          path: spec.activeDeadlineSeconds
      - equal:
          path: spec.activeDeadlineSeconds
          value: 0
      - isNotNull:
          path: spec.startingDeadlineSeconds
      - equal:
          path: spec.startingDeadlineSeconds
          value: 0

  - it: includes activeDeadlineSeconds when set to positive integer
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
            activeDeadlineSeconds: 300
    asserts:
      - isNotNull:
          path: spec.activeDeadlineSeconds
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300

  - it: includes declared init jobs without duplicate names
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
            initContainers:
              example1:
                name: shouldnotmatter
                image: another-example-registry/another-example-image:another-example-tag
              example2:
                image: another-example-registry/another-example-image:another-example-tag
    asserts:
      - isNotNull:
          path: spec.template.spec.initContainers
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: example1
            image: another-example-registry/another-example-image:another-example-tag
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: example2
            image: another-example-registry/another-example-image:another-example-tag
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: shouldnotmatter
            image: another-example-registry/another-example-image:another-example-tag

  - it: includes app.kubernetes.io/name label in pod template
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
      applicationName: my-app
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: my-app

  - it: includes application.stakater.com/workload-class label with value batch in pod template
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
      applicationName: my-app
    asserts:
      - equal:
          path: spec.template.metadata.labels["application.stakater.com/workload-class"]
          value: batch

  - it: uses image templating
    set:
      custom:
        image:
          repository: another-example-registry/another-example-image
          tag: another-example-tag
          digest: sha256:another-example-digest
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: "{{ .Values.custom.image.repository }}"
              tag:  "{{ .Values.custom.image.tag }}"
              digest: "{{ .Values.custom.image.digest }}"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: another-example-registry/another-example-image:another-example-tag@sha256:another-example-digest
  - it: uses image templating (without tag)
    set:
      custom:
        image:
          repository: another-example-registry/another-example-image
          digest: sha256:another-example-digest
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: "{{ .Values.custom.image.repository }}"
              tag:  "{{ .Values.custom.image.tag }}"
              digest: "{{ .Values.custom.image.digest }}"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: another-example-registry/another-example-image@sha256:another-example-digest

  - it: uses image templating (without digest)
    set:
      custom:
        image:
          repository: another-example-registry/another-example-image
          tag: another-example-tag
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: "{{ .Values.custom.image.repository }}"
              tag:  "{{ .Values.custom.image.tag }}"
              digest: "{{ .Values.custom.image.digest }}"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: another-example-registry/another-example-image:another-example-tag

  - it: uses image templating (without tag and digest)
    set:
      custom:
        image:
          repository: another-example-registry/another-example-image
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: "{{ .Values.custom.image.repository }}"
              tag:  "{{ .Values.custom.image.tag }}"
              digest: "{{ .Values.custom.image.digest }}"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: another-example-registry/another-example-image

  - it: does not render @null when digest field is omitted
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example-registry/example-image:example-tag
      - notMatchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "@null"

  - it: yields default service account name when create is disabled and no existing service account name is given
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
      rbac.serviceAccount.create: false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: uses service account name override when present
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
      rbac.serviceAccount.create: true
      rbac.serviceAccount.name: example-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: example-sa

  - it: uses a generated service account name when not given
    set:
      applicationName: example-app
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
      rbac.serviceAccount.create: true
      rbac.serviceAccount.name: ""
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: example-app

  - it: inherits the container security context from the deployment by default
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            readOnlyRootFilesystem: true
            runAsNonRoot: true

  - it: does not include container security context when the deployment defines none
    set:
      deployment:
        containerSecurityContext: null
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  - it: does not inherit from the deployment when inheritFromDeployment is disabled
    set:
      deployment:
        image:
          repository: deployment-registry/deployment-image
          tag: deployment-tag
        securityContext:
          fsGroup: 2000
      job:
        enabled: true
        jobs:
          example:
            inheritFromDeployment: false
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext
      - notExists:
          path: spec.template.spec.securityContext
      - equal:
          path: spec.template.spec.containers[0].image
          value: example-registry/example-image:example-tag

  - it: inherits image, pull policy, pull secrets and pod security context from the deployment
    set:
      deployment:
        image:
          repository: deployment-registry/deployment-image
          tag: deployment-tag
          pullPolicy: Always
        imagePullSecrets:
          - name: docker-pull
        securityContext:
          fsGroup: 2000
      job:
        enabled: true
        jobs:
          example: {}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: deployment-registry/deployment-image:deployment-tag
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: docker-pull
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 2000

  - it: prefers the job image over the inherited deployment image
    set:
      deployment:
        image:
          repository: deployment-registry/deployment-image
          tag: deployment-tag
          pullPolicy: Always
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
              imagePullPolicy: IfNotPresent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: example-registry/example-image:example-tag
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: mounts the chart managed PVC when persistence is enabled
    set:
      applicationName: example-app
      persistence:
        enabled: true
        mountPVC: true
        mountPath: /data
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - mountPath: /data
              name: example-app-data
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: example-app-data
              persistentVolumeClaim:
                claimName: example-app-data

  - it: uses the configured PVC name when persistence name is set
    set:
      applicationName: example-app
      persistence:
        enabled: true
        mountPVC: true
        mountPath: /data
        name: existing-claim
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: existing-claim

  - it: keeps job volumes and volumeMounts alongside the persistence mount
    set:
      applicationName: example-app
      persistence:
        enabled: true
        mountPVC: true
        mountPath: /data
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
            volumeMounts:
              - name: extra
                mountPath: /tmp/extra
            volumes:
              - name: extra
                emptyDir: {}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - mountPath: /data
              name: example-app-data
            - name: extra
              mountPath: /tmp/extra
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: example-app-data
              persistentVolumeClaim:
                claimName: example-app-data
            - name: extra
              emptyDir: {}

  - it: does not mount the PVC when persistence is enabled but mountPVC is disabled
    set:
      persistence:
        enabled: true
        mountPVC: false
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
      - notExists:
          path: spec.template.spec.volumes

  - it: enable container security context when configured
    set:
      job:
        enabled: true
        jobs:
          example:
            containerSecurityContext:
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              capabilities:
                drop:
                  - ALL
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

  - it: configures automount service account token by default
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: enables automountServiceAccountToken when explicitly set
    set:
      job:
        enabled: true
        jobs:
          example:
            automountServiceAccountToken: true
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: does not include pod security context by default
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: enable pod security context when configured
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
            securityContext:
              fsGroup: 20000
              seccompProfile:
                type: RuntimeDefault
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 20000
            seccompProfile:
              type: RuntimeDefault

  - it: does not include enable service links by default
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - notExists:
          path: spec.template.spec.enableServiceLinks

  - it: enable service links by when configured
    set:
      job:
        enabled: true
        jobs:
          example:
            enableServiceLinks: true
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: true

  - it: disable service links when configured
    set:
      job:
        enabled: true
        jobs:
          example:
            enableServiceLinks: false
            image:
              repository: example-registry/example-image
              tag: example-tag
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false

  - it: configures envFrom with chart-managed secret via nameSuffix
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
            envFrom:
              chart-secret:
                type: secret
                nameSuffix: db-credentials
      applicationName: my-app
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-app-db-credentials
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.optional
          value: false

  - it: configures envFrom with chart-managed configmap via nameSuffix
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
            envFrom:
              chart-configmap:
                type: configmap
                nameSuffix: app-config
      applicationName: my-app
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: my-app-app-config
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.optional
          value: false

  - it: configures envFrom with external secret not managed by chart
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
            envFrom:
              external-secret:
                type: secret
                name: my-existing-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-existing-secret
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.optional
          value: false

  - it: configures envFrom with external configmap not managed by chart
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
            envFrom:
              external-configmap:
                type: configmap
                name: my-existing-configmap
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: my-existing-configmap
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.optional
          value: false

  - it: configures envFrom as optional when configured
    set:
      job:
        enabled: true
        jobs:
          example:
            image:
              repository: example-registry/example-image
              tag: example-tag
            envFrom:
              optional-secret:
                type: secret
                name: my-secret
                optional: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: my-secret
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.optional
          value: true
